# <lang>
#   <zh-CN>官网发布工作流（C-anp-P22 `W-anp-P134`）。
#
#     **它做什么**：在 `main` 变更时重新生成站点 → 跑三项不需要编译的静态门禁 → 发布到 `gh-pages` 分支。
#
#     **与既有 L0 门禁套件的关系（不重复、不冲突）**：
#     - 本工作流**只跑不需要编译的静态子集**（生成 + 双语/N1/N2 + 公开面 + 文档合规）。
#       **完整 L0 门禁套件**（`Invoke-PortalGateSuite.ps1 -Layer L0`，现 29 个）仍需在**本地**运行 ——
#       其中含 .NET Framework 4.8 的构建类门禁，需要 Windows + Visual Studio/MSBuild 环境，不适合在 CI 内重跑。
#     - 因此**不存在重复**：CI 守"发布面"，本地 L0 守"代码与文档整体"；两者的公共部分（如公开面门禁）
#       是**同一个脚本**，不是各写一套。
#
#     **为什么用 windows-latest**：站点脚本是 PowerShell（`Build-PortalSite.ps1` 等），
#       Windows 运行器自带 PowerShell，无需额外安装。
#
#     **⚠️ 未实测声明（重要）**：本工作流在本仓库**尚未在 GitHub 上实际运行过**（远端尚无 `gh-pages` 分支）。
#       首次启用需：① 在仓库 Settings → Pages 把发布源设为 `gh-pages` 分支；② 观察首次运行结果。
#       若推送步骤失败，站点不会更新，但**不会**影响 `main` 分支内容。</zh-CN>
#   <en>Website publishing workflow (C-anp-P22 `W-anp-P134`).
#
#     **What it does**: on changes to `main`, regenerate the site → run three compile-free static gates → publish to the
#     `gh-pages` branch.
#
#     **Relationship to the existing L0 gate suite (no duplication, no conflict)**:
#     - This workflow runs **only the compile-free static subset** (generation + bilingual/N1/N2 + public surface + docs
#       compliance). The **full L0 suite** (`Invoke-PortalGateSuite.ps1 -Layer L0`, currently 29 gates) still runs
#       **locally** — it contains .NET Framework 4.8 build gates that need Windows + Visual Studio/MSBuild and are not
#       suited to re-running inside CI.
#     - Hence **no duplication**: CI guards the "publication surface", local L0 guards "code and docs as a whole"; the
#       overlapping parts (e.g. the public-surface gate) are **the same script**, not two implementations.
#
#     **Why windows-latest**: the site scripts are PowerShell (`Build-PortalSite.ps1` and friends), and the Windows runner
#       ships with PowerShell, so nothing extra must be installed.
#
#     **⚠️ Not-yet-executed notice (important)**: this workflow **has not actually run on GitHub for this repository** yet
#       (the remote has no `gh-pages` branch). To enable it: ① set the publishing source to the `gh-pages` branch under
#       Settings → Pages; ② watch the first run. If the push step fails the site will not update, but it will **not**
#       affect the contents of `main`.</en>
# </lang>
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'dev/scripts/Build-PortalSite.ps1'
      - 'dev/scripts/Test-PortalSitePublicSurface.ps1'
      - 'dev/scripts/Test-PortalPublicDocumentation.ps1'
      - 'dev/scripts/Test-PortalPublishedSiteChecks.ps1'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # <lang>
      #   <zh-CN>生成站点页面，同时执行双语一致性（缺译即失败）、N1（parent 有效）、N2（站内链接可达）。</zh-CN>
      #   <en>Generates site pages while enforcing bilingual parity (a missing translation fails), N1 (valid parent) and N2 (reachable in-site links).</en>
      # </lang>
      - name: Generate site (bilingual + N1 + N2)
        shell: pwsh
        run: ./dev/scripts/Build-PortalSite.ps1

      - name: Verify site public surface (S1-S4)
        shell: pwsh
        run: ./dev/scripts/Test-PortalSitePublicSurface.ps1

      - name: Verify public documentation compliance
        shell: pwsh
        run: ./dev/scripts/Test-PortalPublicDocumentation.ps1

      # <lang>
      #   <zh-CN>发布到 `gh-pages`：把生成后的 `site/` 内容作为分支根。
      #     站点是**生成物**，故以覆盖方式发布；`main` 分支内容不受影响。
      #     使用内置 `GITHUB_TOKEN`，不引入任何第三方 action，也不写入任何密钥。</zh-CN>
      #   <en>Publishes to `gh-pages` with the generated `site/` content as the branch root.
      #     The site is **generated output**, so publishing overwrites; the `main` branch is unaffected.
      #     It uses the built-in `GITHUB_TOKEN`, introduces no third-party action and writes no secrets.</en>
      # </lang>
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          # <lang>
          #   <zh-CN>**每个 git 命令都必须显式检查退出码**。这是首次运行失败的**第二个**根因：
          #     `$ErrorActionPreference = 'Stop'` 只对 PowerShell **cmdlet** 生效，对 `git.exe` 这类**原生命令无效** ——
          #     git 失败时脚本**不会抛异常**，会带着错误状态继续往下跑，把一个小失败放大成难以理解的后续报错。
          #     故此处用包装函数把原生命令的失败转成异常。</zh-CN>
          #   <en>**Every git command must have its exit code checked explicitly.** This was the **second** root cause of the first
          #     failed run: `$ErrorActionPreference = 'Stop'` applies only to PowerShell **cmdlets**, **not to native commands** such
          #     as `git.exe` — when git fails the script does **not** throw and keeps running in a broken state, turning one small
          #     failure into a confusing downstream error. This wrapper converts native-command failure into an exception.</en>
          # </lang>
          function Invoke-Git {
            param([string[]] $GitArgs)
            & git @GitArgs
            if ($LASTEXITCODE -ne 0) {
              throw ('git ' + ($GitArgs -join ' ') + ' 失败，退出码 ' + $LASTEXITCODE)
            }
          }

          $publishDir = Join-Path $env:RUNNER_TEMP 'site-publish'
          if (Test-Path -LiteralPath $publishDir) { Remove-Item -Recurse -Force $publishDir }
          New-Item -ItemType Directory -Path $publishDir | Out-Null
          Copy-Item -Path (Join-Path 'site' '*') -Destination $publishDir -Recurse -Force

          # <lang>
          #   <zh-CN>发布前剔除**构建缓存与生成输出**。它们不是站点内容，且会把本地构建痕迹带进公开分支。
          #     （本地 `jekyll build` 会在 `site/` 下产生 `.jekyll-cache/`；若不剔除，它会被一起发布。）</zh-CN>
          #   <en>Remove **build cache and generated output** before publishing. They are not site content and would carry local build
          #     traces into the public branch. (A local `jekyll build` creates `.jekyll-cache/` under `site/`; without this it would be
          #     published along with everything else.)</en>
          # </lang>
          foreach ($junk in @('.jekyll-cache', '_site')) {
            $p = Join-Path $publishDir $junk
            if (Test-Path -LiteralPath $p) { Remove-Item -Recurse -Force $p }
          }

          # <lang>
          #   <zh-CN>**在一个独立的临时仓库里发布**，不切换主工作区的分支。
          #     这是首次运行失败的**第一个**根因：原实现在主工作区执行 `git switch --orphan gh-pages`，
          #     而**上一步的生成脚本已经改写了 `site/` 下的页面**，工作区是脏的，于是 git 拒绝切换
          #     （`error: Your local changes ... would be overwritten by checkout`）。
          #     改为独立仓库后，主工作区是否脏**完全无关**，也不再有"误提交到 main"的风险。
          #     （首次运行时，失败后脚本继续在主工作区 commit，日志中出现 `[main …] Publish site from …`；
          #     因 push 目标为 `gh-pages` 且失败，远端 main 未受影响。）</zh-CN>
          #   <en>**Publish from a separate temporary repository** and never switch branches in the main workspace.
          #     This was the **first** root cause of the failed run: the original code ran
          #     `git switch --orphan gh-pages` in the main workspace, but **the generation step had already rewritten pages under
          #     `site/`**, leaving the workspace dirty, so git refused to switch
          #     (`error: Your local changes ... would be overwritten by checkout`).
          #     With a separate repository the dirty state of the main workspace is **irrelevant**, and the risk of "committing to
          #     main by mistake" disappears. (In the failed run the script continued and committed in the main workspace — the log
          #     shows `[main …] Publish site from …`; since the push targeted `gh-pages` and failed, remote `main` was unaffected.)</en>
          # </lang>
          Invoke-Git @('init', $publishDir)
          Invoke-Git @('-C', $publishDir, 'checkout', '-b', 'gh-pages')
          Invoke-Git @('-C', $publishDir, 'config', 'user.name', 'github-actions[bot]')
          Invoke-Git @('-C', $publishDir, 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com')
          Invoke-Git @('-C', $publishDir, 'add', '-A')

          # <lang>
          #   <zh-CN>`git diff --cached --quiet` 无变更时退出码为 0，有变更时为 1 ——
          #     这里**直接判断退出码**，不再用 `-not` 包装（包装会让语义绕一圈，且易读错）。</zh-CN>
          # </lang>
          & git -C $publishDir diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No site changes to publish.'
            exit 0
          }

          Invoke-Git @('-C', $publishDir, 'commit', '-m', ('Publish site from ' + $env:GITHUB_SHA))
          Invoke-Git @('-C', $publishDir, 'remote', 'add', 'origin', ('https://x-access-token:' + $env:GITHUB_TOKEN + '@github.com/' + $env:GITHUB_REPOSITORY + '.git'))
          Invoke-Git @('-C', $publishDir, 'push', '--force', 'origin', 'HEAD:gh-pages')
          Write-Host 'Published to gh-pages.'

      # <lang>
      #   <zh-CN>**发布后线上复核**（用户 2026-10-21 裁定"两者都要"中的 CI 侧）。发布成功后对**线上**逐页
      #     核对四项判据：可达性（HTTP 200）、标题与本地构建产物一致、导航可见性、页面内无内部编号。
      #     **`continue-on-error: true` 是刻意为之**：复核失败**只报警、不阻断发布**——"红了该不该阻断/回滚"
      #     是另一个裁定，本周期按默认执行并登记为开放项。同一脚本也可本地手动复跑。
      #     退出码：0 全部通过｜1 发现缺陷（页面已发布，需修复后重新发布）｜2 未确认（传播等待超时，**不当作通过**）。</zh-CN>
      #   <en>**Post-publish live re-check** (the CI half of the user's 2026-10-21 "both" ruling). After a successful
      #     publish it verifies four criteria per page **online**: reachability (HTTP 200), title agreement with the locally
      #     built artifact, navigation visibility, and no internal numbering in the page. **`continue-on-error: true` is
      #     deliberate**: a failed re-check **warns only and never blocks publication** — "should red block or roll back" is a
      #     separate ruling; this cycle keeps the default and registers it as an open item. The same script can be re-run
      #     manually. Exit codes: 0 all pass | 1 defect found (already published; fix and republish) | 2 unconfirmed
      #     (propagation wait timed out — **never treated as a pass**).</en>
      # </lang>
      - name: Re-check published site (C1-C4, warn only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: ./dev/scripts/Test-PortalPublishedSiteChecks.ps1 -WaitSeconds 180