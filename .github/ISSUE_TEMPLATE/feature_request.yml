name: 功能建议
description: 提出新能力或改进建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景与当前遇到的限制，而不只是想要的实现方式
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 是否涉及数据库迁移、主题、模块包契约、权限模型或配置格式
      placeholder: |
        - [ ] 需要数据库迁移
        - [ ] 涉及主题包契约
        - [ ] 涉及模块包（module.json）契约
        - [ ] 涉及权限或数据范围模型
        - [ ] 涉及运行时配置格式
        - [ ] 仅界面或文档
    validations:
      required: true

  - type: textarea
    id: benchmark
    attributes:
      label: 对标依据
      description: |
        本项目要求新增或打磨功能须有对标依据（设计意图、效果、流程、交互、操作体验）。
        请给出你所依据的官方文档、现有产品或其他一手来源，并标注强度：
        一手（官方文档 / 源码）｜ 二手（社区文章）｜ 不适用
    validations:
      required: true