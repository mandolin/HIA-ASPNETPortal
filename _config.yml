# <lang>
#   <zh-CN>Jekyll 站点配置（C-anp-P22 `W-anp-P130`）。
#     主题：`Just the Docs`（**远程主题**）—— 由 GitHub Pages **原生构建**，无自建 CI 链路；
#     该主题"无需特殊插件"，可跑在 GitHub Pages 标准 Jekyll 编译器上，从而绕开其插件白名单限制。
#     以上取舍依据见 `work-zone/dev/plans/works/W-anp-P129-github-pages-research.md`。
#   <en>Jekyll site configuration (C-anp-P22 `W-anp-P130`).
#     Theme: `Just the Docs` (**remote theme**) — built **natively** by GitHub Pages with no custom CI in the path;
#     the theme "requires no special plugins" and runs on GitHub Pages' standard Jekyll compiler, thereby sidestepping
#     its plugin allowlist. See `work-zone/dev/plans/works/W-anp-P129-github-pages-research.md` for the trade-offs.</en>
# </lang>
title: HIA-ASPNETPortal
description: 企业内网 Web Forms 门户平台 / Enterprise intranet portal platform on ASP.NET Web Forms
remote_theme: just-the-docs/just-the-docs@v0.12.0

# <lang>
#   <zh-CN>双语并行：中文位于站点根，英文位于 /en/。两棵树的页面**一一对应**，
#     不存在"只有中文没有英文"的已上架页面 —— 这是本周期的硬约束。</zh-CN>
#   <en>Bilingual parity: Chinese lives at the site root, English under /en/. The two trees are **one-to-one**;
#     no published page may exist in Chinese without its English counterpart — a hard constraint of this cycle.</en>
# </lang>
lang: zh-CN

# <lang>
#   <zh-CN>视觉基调：**HIA 系列主配色**（用户指定）。配色权威源是 HIA 系列自己的设计令牌 ——
#     `HIA-Theme-Builder/HIA/web/src/style.css` 的 `:root`（primary `#0047AB`、secondary `#00A8D3`、
#     蓝色阶 p50–p900、surface/panel/line/text/muted、Inter + Noto Sans CJK SC）。
#     自定义方案定义在 `site/_sass/color_schemes/hia.scss`（变量名已对照本地 gem
#     `just-the-docs v0.12.0` 的 `light.scss` 核实）；landing 组件样式（hero 渐变卡、
#     分区卡片网格、页头品牌线）在 `site/_sass/custom/custom.scss`，取值同源。
#     注意主题文档警告「不要直接编辑 `_sass/support/variables.scss`」——本文件走的是
#     主题支持的 `color_scheme` 机制，不触碰主题内部文件。</zh-CN>
#   <en>Visual tone: the **HIA series' main palette** (user request). The colour authority is the HIA series' own
#     design tokens — the `:root` of `HIA-Theme-Builder/HIA/web/src/style.css` (primary `#0047AB`, secondary
#     `#00A8D3`, blue scale p50–p900, surface/panel/line/text/muted, Inter + Noto Sans CJK SC).
#     The custom scheme lives in `site/_sass/color_schemes/hia.scss` (variable names verified against the local
#     gem `just-the-docs v0.12.0` `light.scss`); landing component styles (hero gradient card, section card grid,
#     header brand line) are in `site/_sass/custom/custom.scss`, same source. Note the theme docs warn "do not edit
#     `_sass/support/variables.scss` directly" — this uses the theme-supported `color_scheme` mechanism and touches
#     no theme-internal files.</en>
# </lang>
color_scheme: hia
search_enabled: true
heading_anchors: true

# <lang>
#   <zh-CN>`C-anp-P32` 收口后复查补充（用户指出"官网看不到代码文档的链接"）：**代码文档必须有导航入口**。
#     `site/api/jsdoc/` 是 JSDoc 产物快照——**无 front matter 的静态文件**，因此不会进入 just-the-docs 的
#     `parent` 层级导航；此前只能从说明页 `/code-documentation/` 点进去，等于"发布了但找不到"。
#     主题为此提供 `nav_external_links`（`components/site_nav.html` 渲染的顶层外链列表），用它把代码文档
#     中英两个入口直接放进侧边导航。说明页仍在「开发」分区内，两者互补：
#     导航负责"看得到"，说明页负责"看得懂"（刷新方式、依赖注意事项、DotNetDoc 现状）。
#
#     **每条带 `lang`，按当前页面语言只显示一条**（用户指出侧边导航同时出现中英两条）：`nav_external_links`
#     默认无条件下渲染全部条目，所以中文页也会挂上英文入口、英文页也挂上中文入口。`site_nav.html`
#     现在按 `lang` 过滤——中文页只出 `代码文档（JSDoc）· 中文`，英文页只出 `Code documentation (JSDoc) · English`。
#     这与同一文件里页面树的语言过滤是同一个机制（`nav_lang`），页面树早就按语言分开了，外链是漏掉的那一半。</zh-CN>
#   <en>Post-closeout follow-up in `C-anp-P32` (the user pointed out "the site shows no link to the code documentation"):
#     **the code documentation must have a navigation entry**. `site/api/jsdoc/` is a JSDoc artifact snapshot —
#     **static files without front matter**, so they never enter just-the-docs' `parent`-based navigation; previously
#     the only path in was via the explainer page `/code-documentation/`, i.e. "published but unfindable".
#     The theme provides `nav_external_links` (the top-level external list rendered by `components/site_nav.html`);
#     use it to put the code-documentation entries directly into the side navigation.
#     The explainer page stays inside the Develop section; the two are complementary: navigation makes it
#     **visible**, the explainer makes it **understandable** (refresh procedure, dependency notes, DotNetDoc status).
#
#     **Each entry carries `lang` so only the current language's entry is shown** (the user pointed out that the side
#     navigation showed both at once): `nav_external_links` renders every entry unconditionally, so a Chinese page
#     also carried the English entry and vice versa. `site_nav.html` now filters by `lang` — a Chinese page shows only
#     `代码文档（JSDoc）· 中文`, an English page only `Code documentation (JSDoc) · English`. This is the same mechanism
#     (`nav_lang`) that already filters the page tree in that file; the external links were the half that was missed.</en>
# </lang>
# <lang>
#   <zh-CN>**DotNetDoc 半边同样两条、同样按 `lang` 过滤**（`C-anp-P36` / `W-anp-P203` 补）。它指向
#     `index.zh-CN.html` / `index.en.html` 这两个**语言专属入口页**，而不是共用一个双语页——
#     否则中文导航与英文导航会落在同一页上，语言过滤就白做了。语言页对"只有英文的半边"
#     （页面表层、工程发现）**如实标注"仅英文"**，不藏也不装中文。</zh-CN>
#   <en>**The DotNetDoc half likewise has two entries, likewise filtered by `lang`** (added by `C-anp-P36` /
#     `W-anp-P203`). They point at `index.zh-CN.html` / `index.en.html`, the **language-specific entry pages**, rather
#     than sharing one bilingual page — otherwise both the Chinese and English navigation would land on the same page and
#     the language filtering would be undone. A language page **honestly marks an English-only half** (surface,
#     project discovery) as "English only" — neither hidden nor faked as Chinese.</en>
# </lang>
nav_external_links:
  - title: 代码文档（JSDoc）· 中文
    url: /api/jsdoc/index.zh-CN.html
    lang: zh-CN
  - title: Code documentation (JSDoc) · English
    url: /api/jsdoc/index.en.html
    lang: en
  - title: 代码文档（DotNetDoc）· 中文
    url: /api/dotnetdoc/
    lang: zh-CN
  - title: Code documentation (DotNetDoc) · English
    url: /api/dotnetdoc/
    lang: en

# <lang>
#   <zh-CN>生成物由 `dev/scripts/Build-PortalSite.ps1` 从 `docs/` 与翻译源产出；
#     本目录为**站点源码版本化位置**，不是运行期输出。</zh-CN>
#   <en>Output is produced by `dev/scripts/Build-PortalSite.ps1` from `docs/` plus the translation source;
#   this directory is the **versioned site source**, not runtime output.</en>
# </lang>
exclude:
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
