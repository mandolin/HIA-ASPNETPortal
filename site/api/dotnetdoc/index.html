tton type="button" class="hia-project-secondary-action" data-hia-project-relations>项目关系</button></aside><main class="hia-main hia-project-main" data-hia-project-content><p class="hia-project-empty">请从左侧层级导航选择一个文档节点。</p><noscript><p class="hia-noscript-notice"><a href="pages/index.html">No-script page index / 无脚本页面索引</a></p></noscript></main></div><script src="assets/hia-default.js"></script><script>(() => {  const config = { navigation: 'navigation/root.json', search: 'search/index.json', relations: 'relations/project.json', loadingStrategy: "lazy", eagerContent: 'content/eager.json', ui: null };  const treeHost = document.querySelector('[data-hia-project-tree]');  const contentHost = document.querySelector('[data-hia-project-content]');  const search = document.querySelector('[data-hia-project-search]');  const contentLocale = document.querySelector('[data-hia-locale-control]');  const uiLocale = document.querySelector('[data-hia-ui-locale-control]');  const viewButtons = Array.from(document.querySelectorAll('[data-hia-project-view]'));  let rootNodes = [];  let searchEntries = null;  let eagerFragments = null;  let activeView = 'all';  function uiMessage(messageId, values = {}, fallback = messageId) {    const selected = String(uiLocale?.value || config.ui?.initialLocale || document.documentElement.lang || 'en');    const template = config.ui?.bundles?.[selected]?.[messageId] || fallback;    return template.replace(/\{([A-Za-z][A-Za-z0-9_]*)\}/gu, (_match, name) => String(values[name] ?? `{${name}}`));  }  function readUiValues(node) {    try { return JSON.parse(node.getAttribute('data-hia-ui-values') || '{}'); } catch { return {}; }  }  function applyUiLocale(root = document) {    if (!config.ui) return;    const selected = String(uiLocale?.value || config.ui.initialLocale);    if (!config.ui.supportedLocales.includes(selected)) return;    document.documentElement.lang = selected;    for (const node of root.querySelectorAll('[data-hia-ui-message]')) node.textContent = uiMessage(node.getAttribute('data-hia-ui-message'), readUiValues(node));    for (const node of root.querySelectorAll('[data-hia-ui-placeholder]')) node.setAttribute('placeholder', uiMessage(node.getAttribute('data-hia-ui-placeholder')));    for (const node of root.querySelectorAll('[data-hia-ui-aria]')) node.setAttribute('aria-label', uiMessage(node.getAttribute('data-hia-ui-aria')));    try { localStorage.setItem('hia-doc-portal-ui-locale', selected); } catch {}    document.dispatchEvent(new CustomEvent('hia:ui-locale-change', { detail: { uiLocale: selected } }));  }  async function readJson(target) {    const response = await fetch(target, { credentials: 'omit' });    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);    return response.json();  }  function showLoadError(error) {    const detail = location.protocol === 'file:' ? "该站点需要通过 HTTP(S) 提供；请使用本地静态服务器打开输出目录。" : String(error?.message || error);    const hint = location.protocol === 'file:' ? detail : uiMessage('portal.navigation.loaderror', { detail }, detail);    if (contentHost) contentHost.innerHTML = '';    const message = document.createElement('p');    message.className = 'hia-project-load-error';    message.setAttribute('role', 'status');    message.dataset.hiaUiMessage = location.protocol === 'file:' ? 'portal.navigation.requiresserver' : 'portal.navigation.loaderror';    if (location.protocol !== 'file:') message.dataset.hiaUiValues = JSON.stringify({ detail });    message.textContent = hint;    (contentHost || treeHost)?.append(message);  }  function nodeMatchesView(node) {    return activeView === 'all' || (Array.isArray(node.views) && node.views.includes(activeView));  }  function createTreeList(nodes) {    const list = document.createElement('ul');    list.className = 'hia-project-hierarchy-list';    for (const node of nodes.filter(nodeMatchesView)) list.append(createTreeNode(node));    return list;  }  function createTreeNode(node) {    const item = document.createElement('li');    item.dataset.hiaProjectNav = node.views?.[0] || 'other';    item.dataset.hiaProjectNodeId = node.id || '';    if (node.entryId) item.dataset.hiaProjectEntryId = node.entryId;    const inlineChildren = Array.isArray(node.children) ? node.children : [];    if (node.childrenPath || inlineChildren.length > 0) {      const details = document.createElement('details');      details.dataset.hiaProjectDisclosure = node.id || '';      const summary = document.createElement('summary');      const summaryLabel = document.createElement('span');      summaryLabel.textContent = `${node.label} (${node.entryCount})`;      summary.append(summaryLabel);      if (node.entryId && node.contentPath) {        const openButton = document.createElement('button');        openButton.type = 'button';        openButton.className = 'hia-project-entry-link hia-project-tree-open';        openButton.dataset.hiaUiMessage = 'portal.navigation.open';        openButton.textContent = uiMessage('portal.navigation.open', {}, "打开");        openButton.addEventListener('click', (event) => {          event.preventDefault();          event.stopPropagation();          loadEntry(node, true);        });        summary.append(openButton);      }      details.append(summary);      if (inlineChildren.length > 0) {        details.dataset.loaded = 'true';        details.append(createTreeList(inlineChildren));      } else {        details.addEventListener('toggle', async () => {          if (!details.open || details.dataset.loaded === 'true') return;          details.dataset.loaded = 'true';          const loading = document.createElement('p');          loading.className = 'hia-project-loading';          loading.setAttribute('role', 'status');          loading.dataset.hiaUiMessage = 'portal.navigation.loading';          loading.textContent = uiMessage('portal.navigation.loading', {}, "正在加载文档导航...");          details.append(loading);          try {            const shard = await readJson(node.childrenPath);            loading.replaceWith(createTreeList(Array.isArray(shard.children) ? shard.children : []));          } catch (error) {            loading.textContent = String(error?.message || error);          }        });      }      item.append(details);    } else if (node.entryId && node.contentPath) {      const button = document.createElement('button');      button.type = 'button';      button.className = 'hia-project-entry-link';      button.textContent = node.label;      button.addEventListener('click', () => loadEntry(node, true));      item.append(button);    } else {      const label = document.createElement('span');      label.textContent = node.label;      item.append(label);    }    return item;  }  function renderRoot() {    if (!treeHost) return;    treeHost.innerHTML = '';    if (rootNodes.length > 0) { treeHost.append(createTreeList(rootNodes)); return; }    /* <lang><zh-CN>空项目仍生成带稳定 message identity 的可翻译状态。</zh-CN><en>An empty project still renders a translatable state with a stable message identity.</en></lang> */    const empty = document.createElement('p');    empty.className = 'hia-project-empty';    empty.dataset.hiaUiMessage = 'portal.common.noentries';    empty.textContent = uiMessage('portal.common.noentries', {}, 'No project documentation entries.');    treeHost.append(empty);  }  function applyContentLocale() {    const selected = String(contentLocale?.value || 'und');    for (const block of document.querySelectorAll('[data-hia-locale]')) {      block.hidden = block.getAttribute('data-hia-locale') !== selected;    }  }  const sourceControllers = new WeakMap();  const sourceTerminalStates = new Set(['ready', 'empty', 'denied', 'not-found', 'integrity-error', 'network-error', 'aborted']);  function sourceUiMessage(messageId, fallback, values = {}) {    return typeof uiMessage === 'function' && typeof config !== 'undefined' && config.ui ? uiMessage(messageId, values, fallback) : fallback;  }  function setSourceState(details, state, messageId = '', fallback = '', values = {}) {    const loadButton = details.querySelector('[data-hia-source-fetch-button]');    const resetButton = details.querySelector('[data-hia-source-reset]');    const status = details.querySelector('[data-hia-source-fetch-status]');    details.dataset.hiaSourceState = state;    details.toggleAttribute('aria-busy', state === 'loading');    if (status) {      status.hidden = state === 'idle';      if (messageId) status.dataset.hiaUiMessage = messageId; else delete status.dataset.hiaUiMessage;      if (Object.keys(values).length > 0) status.dataset.hiaUiValues = JSON.stringify(values); else delete status.dataset.hiaUiValues;      status.textContent = messageId ? sourceUiMessage(messageId, fallback, values) : '';    }    if (loadButton) loadButton.hidden = state !== 'idle';    if (resetButton) {      resetButton.hidden = state === 'idle';      const resetMessageId = state === 'loading' ? 'portal.source.cancel' : 'portal.source.reset';      resetButton.dataset.hiaUiMessage = resetMessageId;      resetButton.textContent = sourceUiMessage(resetMessageId, state === 'loading' ? 'Cancel' : 'Reset');    }  }  function sourceFailureState(response) {    if (response.status === 401 || response.status === 403) return 'denied';    if (response.status === 404) return 'not-found';    return 'network-error';  }  function digestBase64(buffer) {    return btoa(String.fromCharCode(...new Uint8Array(buffer)));  }  async function loadSourceFetch(details) {    if ((details.dataset.hiaSourceState || 'idle') !== 'idle') return;    const code = details.querySelector('code');    const controller = new AbortController();    const timeoutMs = Math.max(100, Number(details.dataset.hiaSourceTimeout || 10000));    const timeout = setTimeout(() => controller.abort(), timeoutMs);    sourceControllers.set(details, controller);    setSourceState(details, 'loading', 'portal.source.status.loading', 'Loading source...');    try {      /* <lang><zh-CN>只允许文档站同源且无 userinfo 的 content-addressed endpoint。</zh-CN><en>Allow only a same-origin content-addressed endpoint without userinfo.</en></lang> */      const target = new URL(details.dataset.hiaSourceFetch || '', document.baseURI);      if (target.origin !== location.origin || target.username || target.password) {        setSourceState(details, 'denied', 'portal.source.status.denied', 'Source request denied.');        return;      }      /* <lang><zh-CN>请求固定无凭据、同源且拒绝 redirect；signal 同时承担取消与超时。</zh-CN><en>The request is credential-free, same-origin, and redirect-denying; the signal covers cancellation and timeout.</en></lang> */      const response = await fetch(target, { cache: 'default', credentials: 'omit', mode: 'same-origin', redirect: 'error', signal: controller.signal });      if (!response.ok) {        const state = sourceFailureState(response);        const detail = `${response.status} ${response.statusText}`;        setSourceState(details, state, 'portal.source.status.failed', `Source load failed: ${detail}`, { detail });        return;      }      /* <lang><zh-CN>先验证字节数与 SHA-384，再把公开 asset 解码为不可执行纯文本。</zh-CN><en>Verify byte length and SHA-384 before decoding the public asset as non-executable plain text.</en></lang> */      const bytes = await response.arrayBuffer();      const maxBytes = Math.max(1, Number(details.dataset.hiaSourceMaxBytes || 1048576));      const expectedBytes = Number(details.dataset.hiaSourceByteLength || 0);      if (bytes.byteLength > maxBytes || (expectedBytes >= 0 && bytes.byteLength !== expectedBytes)) {        setSourceState(details, 'integrity-error', 'portal.source.status.size', 'Source size verification failed.');        return;      }      const digest = await crypto.subtle.digest('SHA-384', bytes);      if (`sha384-${digestBase64(digest)}` !== details.dataset.hiaSourceIntegrity) {        setSourceState(details, 'integrity-error', 'portal.source.status.integrity', 'Source integrity verification failed.');        return;      }      /* <lang><zh-CN>非法 UTF-8 表示 asset 违反 text contract，归入 integrity-error。</zh-CN><en>Invalid UTF-8 violates the text-asset contract and maps to integrity-error.</en></lang> */      let text;      try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }      catch { setSourceState(details, 'integrity-error', 'portal.source.status.decode', 'Source text decoding failed.'); return; }      if (text.length === 0) {        if (code) code.textContent = '';        setSourceState(details, 'empty', 'portal.source.status.empty', 'Source asset is empty.');        return;      }      /* <lang><zh-CN>只投影配置允许的行数，绝不执行或加入搜索索引。</zh-CN><en>Project only the configured line limit, never executing or search-indexing the body.</en></lang> */      const lines = text.split(/\r?\n/u);      const maxLines = Math.max(1, Number(details.dataset.hiaSourceMaxLines || 400));      /* <lang><zh-CN>正文只通过Text节点加入DOM；行号链接只指向同源生成页，不产生重复行id。</zh-CN><en>Insert bodies only through Text nodes; line links target generated same-origin pages without duplicate line IDs.</en></lang> */      if (code) {        const fragment = document.createDocumentFragment();        const parsedStart = Number(details.dataset.hiaSourceStartLine || 1);        const startLine = Number.isSafeInteger(parsedStart) && parsedStart > 0 ? parsedStart : 1;        const viewer = details.dataset.hiaSourceLink ? new URL(details.dataset.hiaSourceLink, document.baseURI) : undefined;        const safeViewer = viewer && viewer.origin === location.origin && !viewer.username && !viewer.password ? viewer : undefined;        for (const [index, text] of lines.slice(0, maxLines).entries()) {          const number = startLine + index;          const row = document.createElement('span');          row.className = 'hia-source-code-line';          row.dataset.hiaSourceLineNumber = String(number);          row.style.cssText = 'display:block;min-width:max-content';          const label = document.createElement(safeViewer ? 'a' : 'span');          label.className = 'hia-source-line-number';          label.style.cssText = 'display:inline-block;min-width:3ch;margin-inline-end:1.25rem;text-align:right;user-select:none;color:inherit';          label.textContent = String(number);          if (safeViewer) { label.href = safeViewer.pathname + safeViewer.search + '#L' + number; label.setAttribute('aria-label', 'L' + number); }          else label.setAttribute('aria-hidden', 'true');          row.append(label, document.createTextNode(text));          fragment.append(row);        }        code.replaceChildren(fragment);      }      setSourceState(details, 'ready', 'portal.source.status.ready', 'Source ready.');    } catch (error) {      const aborted = error?.name === 'AbortError';      const detail = String(error?.message || error);      setSourceState(details, aborted ? 'aborted' : 'network-error', aborted ? 'portal.source.status.aborted' : 'portal.source.status.failed', aborted ? 'Source load aborted.' : `Source load failed: ${detail}`, aborted ? {} : { detail });    } finally {      clearTimeout(timeout);      sourceControllers.delete(details);    }  }  /* <lang><zh-CN>终态必须显式 reset 回 idle；loading 状态的同一操作只负责取消。</zh-CN><en>Terminal states require an explicit reset to idle; the same action only cancels while loading.</en></lang> */  function resetSourceFetch(details) {    const state = details.dataset.hiaSourceState || 'idle';    if (state === 'loading') { sourceControllers.get(details)?.abort(); return; }    if (!sourceTerminalStates.has(state)) return;    const code = details.querySelector('code');    if (code) code.textContent = '';    setSourceState(details, 'idle');  }  function bindSourceFetch(root = contentHost) {    for (const details of root?.querySelectorAll('details[data-hia-source-fetch]') || []) {      const button = details.querySelector('[data-hia-source-fetch-button]');      const resetButton = details.querySelector('[data-hia-source-reset]');      if (button) button.addEventListener('click', () => loadSourceFetch(details));      if (resetButton) resetButton.addEventListener('click', () => resetSourceFetch(details));      setSourceState(details, details.dataset.hiaSourceState || 'idle');      if (details.dataset.hiaSourceFetchTrigger !== 'manual') {        details.addEventListener('toggle', () => {          if (details.open) void loadSourceFetch(details);        });        if (details.open) void loadSourceFetch(details);      }    }  }  async function ensureEagerFragments() {    if (config.loadingStrategy !== 'eager') return null;    if (eagerFragments) return eagerFragments;    const index = await readJson(config.eagerContent);    eagerFragments = new Map((Array.isArray(index.fragments) ? index.fragments : []).map((fragment) => [fragment.path, fragment.contents]));    return eagerFragments;  }  async function readFragment(path) {    const eager = await ensureEagerFragments();    if (eager?.has(path)) return eager.get(path);    const response = await fetch(path, { credentials: 'omit' });    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);    return response.text();  }  function markActiveEntry(entryId) {    for (const item of document.querySelectorAll('[data-hia-project-node-id]')) {      delete item.dataset.hiaActiveEntry;      for (const details of item.querySelectorAll(':scope > details')) delete details.dataset.hiaActiveAncestor;    }    const leaf = Array.from(document.querySelectorAll('[data-hia-project-entry-id]')).find((item) => item.dataset.hiaProjectEntryId === entryId);    if (!leaf) return;    leaf.dataset.hiaActiveEntry = 'true';    for (const details of leaf.parentElement?.closest('details') ? [leaf.parentElement.closest('details')] : []) {      let current = details;      while (current) { current.open = true; current.dataset.hiaActiveAncestor = 'true'; current = current.parentElement?.closest('details'); }    }  }  async function loadEntry(entry, updateHash) {    if (!contentHost) return;    contentHost.innerHTML = `<p class="hia-project-loading" role="status" data-hia-ui-message="portal.navigation.loading">${uiMessage('portal.navigation.loading', {}, "正在加载文档导航...")}</p>`;    try {      const contentPath = entry.presentationPath || entry.contentPath;      contentHost.innerHTML = await readFragment(contentPath);      applyContentLocale();      applyUiLocale(contentHost);      bindSourceFetch();      const anchor = entry.memberAnchor || entry.entryId || entry.id;      const target = Array.from(contentHost.querySelectorAll('[id]')).find((item) => item.id === anchor);      target?.scrollIntoView({ block: 'start' });      markActiveEntry(entry.entryId || entry.id);      if (updateHash) history.replaceState(null, '', `#entry=${encodeURIComponent(entry.entryId || entry.id)}`);    } catch (error) {      showLoadError(error);    }  }  async function ensureSearchIndex() {    if (searchEntries) return searchEntries;    const index = await readJson(config.search);    searchEntries = Array.isArray(index.entries) ? index.entries : [];    return searchEntries;  }  async function runSearch() {    const query = String(search?.value || '').trim().toLowerCase();    if (!query) { renderRoot(); return; }    try {      const entries = await ensureSearchIndex();      const matches = entries.filter((entry) => (activeView === 'all' || entry.view === activeView) && String(entry.searchText || '').includes(query)).slice(0, 200);      if (!treeHost) return;      treeHost.innerHTML = '';      const nodes = matches.map((entry) => ({ id: entry.id, label: `${entry.name} · ${entry.kind}`, entryId: entry.id, contentPath: entry.contentPath, presentationPath: entry.presentationPath, memberAnchor: entry.memberAnchor, views: [entry.view], entryCount: 1 }));      if (nodes.length > 0) { treeHost.append(createTreeList(nodes)); return; }      /* <lang><zh-CN>筛选空结果使用 polite status，同时保留独立的 message identity。</zh-CN><en>An empty filter result uses a polite status while retaining its own message identity.</en></lang> */      const empty = document.createElement('p');      empty.className = 'hia-project-empty';      empty.setAttribute('role', 'status');      empty.setAttribute('aria-live', 'polite');      empty.dataset.hiaUiMessage = 'portal.common.nomatches';      empty.textContent = uiMessage('portal.common.nomatches', {}, 'No entries match the current filters.');      treeHost.append(empty);    } catch (error) { showLoadError(error); }  }  for (const button of viewButtons) {    button.addEventListener('click', () => {      activeView = button.dataset.hiaProjectView || 'all';      for (const candidate of viewButtons) candidate.setAttribute('aria-pressed', String(candidate === button));      runSearch();    });  }  search?.addEventListener('input', runSearch);  contentLocale?.addEventListener('change', applyContentLocale);  uiLocale?.addEventListener('change', () => applyUiLocale());  document.querySelector('[data-hia-project-relations]')?.addEventListener('click', async () => {    try {      const graph = await readJson(config.relations);      if (!contentHost) return;      contentHost.innerHTML = '';      const article = document.createElement('article');      article.className = 'hia-symbol';      const heading = document.createElement('h2');      heading.dataset.hiaUiMessage = 'portal.navigation.relations';      heading.textContent = uiMessage('portal.navigation.relations', {}, "项目关系");      const summary = document.createElement('p');      summary.dataset.hiaUiMessage = 'portal.navigation.relationsummary';      summary.dataset.hiaUiValues = JSON.stringify({ nodes: graph.nodeCount || 0, relations: graph.relationCount || 0 });      summary.textContent = uiMessage('portal.navigation.relationsummary', { nodes: graph.nodeCount || 0, relations: graph.relationCount || 0 }, `${graph.nodeCount || 0} nodes, ${graph.relationCount || 0} relations`);      article.append(heading, summary);      contentHost.append(article);    } catch (error) { showLoadError(error); }  });  readJson(config.navigation).then((shard) => {    rootNodes = Array.isArray(shard.children) ? shard.children : [];    renderRoot();    const hash = location.hash.startsWith('#entry=') ? decodeURIComponent(location.hash.slice(7)) : '';    if (hash) ensureSearchIndex().then((entries) => {      const entry = entries.find((candidate) => candidate.id === hash);      if (entry) loadEntry({ ...entry, entryId: entry.id }, false);    });  }).catch(showLoadError);  if (config.ui && uiLocale) {    try {      const saved = localStorage.getItem('hia-doc-portal-ui-locale');      if (saved && config.ui.supportedLocales.includes(saved)) uiLocale.value = saved;    } catch {}  }  applyContentLocale();  applyUiLocale();  viewButtons.find((button) => button.dataset.hiaProjectView === 'all')?.setAttribute('aria-pressed', 'true');})();</script></body></html>
