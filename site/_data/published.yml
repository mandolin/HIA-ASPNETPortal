# <lang>
#   <zh-CN>**上架清单**（C-anp-P22 `W-anp-P130` 建立，`W-anp-P132` 改为结构化）。
#     只有在此列出的页面才会被 `Build-PortalSite.ps1` 校验与生成。
#
#     字段：
#     - `doc`   —— 中文权威源文件名（位于 `docs/`）
#     - `path`  —— **站点路径段**（中文章为 `/<path>/`，英文章为 `/en/<path>/`）
#     - `parent`—— 所属导航分区，必须与 `_data/navigation.yml` 的某个条目 `title` 一致
#
#     规则（双语并行的强制点）：
#     1. 一个页面**只有当其中文源（`docs/<doc>`）与英文译本（`site/_translations/<doc>`）都存在时**，
#        才允许加入本清单；
#     2. 缺译而加入 → 门禁 Fail（上架声明无效）；
#     3. 未加入本清单的页面计入"待译"信息，**不阻断构建**。
#
#     **为什么要显式声明 `path`（`W-anp-P132` 的教训）**：初版没有 path，脚本直接用文档文件名当路径，
#     而导航与首页按"理想路径"（`/overview/`、`/quickstart/`…）书写 —— 两套路径体系不一致，
#     导致**导航与首页链接全部指向 404**，且门禁完全没有发现。现在路径只有**一个来源**，
#     并由脚本校验 `parent` 必须在导航骨架中存在。</zh-CN>
#   <en>**Published list** (established in C-anp-P22 `W-anp-P130`, restructured in `W-anp-P132`).
#     Only pages listed here are validated and generated by `Build-PortalSite.ps1`.
#
#     Fields:
#     - `doc`    — Chinese authoritative source file name (under `docs/`)
#     - `path`   — **site path segment** (Chinese page at `/<path>/`, English at `/en/<path>/`)
#     - `parent` — owning navigation section; must match a `title` in `_data/navigation.yml`
#
#     Rules (the enforcement point for bilingual parity):
#     1. A page may be added **only when both its Chinese source (`docs/<doc>`) and English render
#        (`site/_translations/<doc>`) exist**;
#     2. Adding a page without a translation fails the gate (invalid publish declaration);
#     3. Pages not listed count as "pending translation" and do **not** block the build.
#
#     **Why `path` is declared explicitly (lesson from `W-anp-P132`)**: the first version had no path, so the script used
#     the document file name as the path while navigation and the home page used "ideal" paths (`/overview/`,
#     `/quickstart/`…) — two incompatible path systems made **every navigation and home-page link resolve to 404**, and no
#     gate caught it. Now there is a **single source** for paths, and the script verifies that `parent` exists in the
#     navigation skeleton.</en>
# </lang>
